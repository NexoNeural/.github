name: Cambio de alcance
description: Una petición que llega con el sprint ya empezado. Queda pendiente de decisión.
type: Cambio de alcance
title: "[Cliente/Módulo] "
labels:
  - "necesita-decision"
body:
  - type: textarea
    id: pide
    attributes:
      label: Qué se pide
      description: El cambio, de forma concreta.
    validations:
      required: true
  - type: textarea
    id: urgencia
    attributes:
      label: Por qué no puede esperar al siguiente sprint
      description: Qué pasa si se deja para después.
    validations:
      required: true
  - type: textarea
    id: compensacion
    attributes:
      label: Qué se retrasa o se deja fuera
      description: Cómo se compensa dentro del sprint actual.
    validations:
      required: true

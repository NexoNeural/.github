name: Error
description: Algo que no funciona como debería.
type: Error
title: "[Cliente/Módulo] "
labels:
  - "necesita-estimacion"
  - "necesita-asignacion"
body:
  - type: textarea
    id: que_pasa
    attributes:
      label: Qué pasa
      description: Qué ves y dónde ocurre. No pegues contraseñas, claves ni datos de clientes.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      description: Pasos para que otra persona lo vea.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
      description: El resultado correcto.
    validations:
      required: true

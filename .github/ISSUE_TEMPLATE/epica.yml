name: Épica
description: Un objetivo grande que se divide en tareas. No entra en un sprint, solo sus tareas.
type: Épica
title: "[Cliente/Módulo] "
labels:
  - "necesita-desglose"
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué consigue el cliente cuando la épica esté terminada.
    validations:
      required: true
  - type: textarea
    id: incluye
    attributes:
      label: Qué incluye
      description: Lo que sí se hará.
    validations:
      required: true
  - type: textarea
    id: no_incluye
    attributes:
      label: Qué NO incluye
      description: Lo que queda fuera.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Se da por terminada cuando…
      description: Comprobaciones que se responden con un sí o un no.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
